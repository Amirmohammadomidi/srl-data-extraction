<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="400" viewBox="0 0 1800 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F7F7F"/>
    </marker>
  </defs>

  <rect width="1800" height="400" fill="#FFFFFF"/>

  <text x="900" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1F3864">SRL-Extraction Pipeline</text>
  <text x="900" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#595959">From OntoNotes 5.0 WSJ annotations to a clean SRL/ORL dataset</text>

  <!-- Box 1: Corpus files -->
  <rect x="75" y="140" width="210" height="140" rx="10" fill="#DEEAF6" stroke="#2E75B6" stroke-width="2"/>
  <text x="180" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F3864">Corpus files</text>
  <text x="180" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">.prop + .onf</text>
  <text x="180" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">OntoNotes WSJ</text>

  <!-- Arrow 1 -->
  <line x1="289" y1="210" x2="311" y2="210" stroke="#7F7F7F" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 2: PropBank Parser -->
  <rect x="315" y="140" width="210" height="140" rx="10" fill="#DEEAF6" stroke="#2E75B6" stroke-width="2"/>
  <text x="420" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F3864">PropBank Parser</text>
  <text x="420" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">propositions</text>
  <text x="420" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">+ role pointers</text>

  <!-- Arrow 2 -->
  <line x1="529" y1="210" x2="551" y2="210" stroke="#7F7F7F" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Tree Mapping -->
  <rect x="555" y="140" width="210" height="140" rx="10" fill="#DEEAF6" stroke="#2E75B6" stroke-width="2"/>
  <text x="660" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F3864">Tree Mapping</text>
  <text x="660" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">sentence &#8596; tree</text>
  <text x="660" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">alignment</text>

  <!-- Arrow 3 -->
  <line x1="769" y1="210" x2="791" y2="210" stroke="#7F7F7F" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 4: Span Conversion -->
  <rect x="795" y="140" width="210" height="140" rx="10" fill="#DEEAF6" stroke="#2E75B6" stroke-width="2"/>
  <text x="900" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F3864">Span Conversion</text>
  <text x="900" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">tree pointers</text>
  <text x="900" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">&#8594; text spans</text>

  <!-- Arrow 4 -->
  <line x1="1009" y1="210" x2="1031" y2="210" stroke="#7F7F7F" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 5: Trace Removal -->
  <rect x="1035" y="140" width="210" height="140" rx="10" fill="#DEEAF6" stroke="#2E75B6" stroke-width="2"/>
  <text x="1140" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F3864">Trace Removal</text>
  <text x="1140" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">regex cleaning</text>
  <text x="1140" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">*T*- / *PRO*-</text>

  <!-- Arrow 5 -->
  <line x1="1249" y1="210" x2="1271" y2="210" stroke="#7F7F7F" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 6: ORL Mapping -->
  <rect x="1275" y="140" width="210" height="140" rx="10" fill="#DEEAF6" stroke="#2E75B6" stroke-width="2"/>
  <text x="1380" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F3864">ORL Mapping</text>
  <text x="1380" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">ARG0 &#8594; Holder</text>
  <text x="1380" y="224" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">REL &#8594; Expression</text>
  <text x="1380" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">ARG1 &#8594; Target</text>

  <!-- Arrow 6 -->
  <line x1="1489" y1="210" x2="1511" y2="210" stroke="#7F7F7F" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 7: CSV Output -->
  <rect x="1515" y="140" width="210" height="140" rx="10" fill="#DEEAF6" stroke="#2E75B6" stroke-width="2"/>
  <text x="1620" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F3864">CSV Output</text>
  <text x="1620" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">SENTENCE, PREDICATES,</text>
  <text x="1620" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">ARG0, ARG1, MERGED</text>

  <!-- Footer -->
  <line x1="75" y1="330" x2="1725" y2="330" stroke="#D9D9D9" stroke-width="1.5"/>
  <text x="900" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#595959">Full pipeline: notebooks/     |     Runnable subset: sample_data/ + demo_with_sample_data.ipynb</text>
</svg>
